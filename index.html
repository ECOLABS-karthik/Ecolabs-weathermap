<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google-site-verification" content="l8Wxq7LG5EtopIJGGBWocHQkW3j5nvsXH9Nea_1kUqE" />
<title>India Weather Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--mh:52px;--ink:#16222e;--mut:#5d6b7a;--bg:#fff;--line:#e3e8ee;--acc:#0f6b8f;--sh:0 4px 18px rgba(20,40,60,.16)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink)}
#map{position:absolute;inset:0;background:#cfe3ee}
.leaflet-container{font-family:inherit}
.card{background:var(--bg);border-radius:14px;box-shadow:var(--sh)}
#top{position:absolute;z-index:1000;top:calc(max(10px,env(safe-area-inset-top)) + var(--mh));left:10px;right:10px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}
#brand{padding:9px 14px;white-space:nowrap}
#brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
#status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
#dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;animation:pulse 1.2s infinite}
#dot.ok{background:#22c55e;animation:none}#dot.err{background:#ef4444;animation:none}
@keyframes pulse{50%{opacity:.3}}
#sw{position:relative;flex:1;max-width:380px}
#q{width:100%;height:46px;border:0;border-radius:14px;padding:0 14px;font:inherit;box-shadow:var(--sh);outline:none}
#q:focus{box-shadow:var(--sh),0 0 0 2px var(--acc)}
#res{position:absolute;top:50px;left:0;right:0;overflow:hidden;display:none}
#res button{display:block;width:100%;text-align:left;padding:10px 14px;border:0;background:none;font:inherit;cursor:pointer;border-bottom:1px solid var(--line)}
#res button:hover{background:#f1f6f9}#res small{color:var(--mut);display:block}
#bt{height:46px;padding:0 14px;border:0;cursor:pointer;font:inherit;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
#bt span{font-size:18px}
#ctl{position:absolute;z-index:1000;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + var(--mh) + 64px);display:flex;flex-direction:column;gap:8px}
#ctl button{width:44px;height:44px;border:0;border-radius:12px;background:#fff;box-shadow:var(--sh);font-size:19px;cursor:pointer;color:var(--ink)}
#ctl button:active{background:#e8f1f5}
#ctl button.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
#lay{position:absolute;z-index:1000;right:62px;top:calc(max(10px,env(safe-area-inset-top)) + var(--mh) + 64px);padding:10px 14px;display:none;max-height:calc(100% - 200px);overflow-y:auto}
#lay label{display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer;white-space:nowrap}
.lh{font-weight:600;margin:8px 0 6px;font-size:13px}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer;text-align:left;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}.chip:disabled{opacity:.45}
#lgwrap{position:absolute;z-index:1000;left:10px;top:calc(max(10px,env(safe-area-inset-top)) + var(--mh) + 64px);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#rtbtn{border:0;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink);display:flex;gap:6px;align-items:center}
#legend{padding:8px 10px;font-size:12.5px}
#legend summary{cursor:pointer;font-weight:600;padding:2px 0;list-style:none}
#legend summary::-webkit-details-marker{display:none}
#lgb{margin-top:4px}
#lgb>div{display:flex;align-items:center;gap:8px;padding:5px 0}
#lgb>div+div{border-top:1px solid #dde4ea}
#legend i{width:16px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.2)}
#sheet{position:absolute;z-index:1100;left:0;right:0;bottom:0;margin:0 auto;width:min(100%,760px);max-height:36vh;min-height:190px;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -6px 28px rgba(20,40,60,.22);transform:translateY(105%);transition:transform .33s cubic-bezier(.22,.9,.3,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.pw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.pc{background:#f2f6f9;border-radius:12px;padding:9px 11px}
.pc b{font-size:13px;display:block}.pc big{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.pc small{display:block;color:var(--mut);font-size:11.5px;line-height:1.35}
.pc.tot{background:var(--acc);color:#fff}.pc.tot small{color:#d6edf5}
.fn{color:var(--mut);font-size:11.5px;margin:2px 0 10px}
#sheet.big{max-height:50vh}
@media(max-width:640px){.pw{grid-template-columns:repeat(2,1fr)}}
#sheet.open{transform:none}#sheet.drag{transition:none}
#grab{flex:none;height:26px;position:relative;touch-action:none;cursor:grab}
#grab i{position:absolute;left:50%;top:9px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:#cbd5df}
#x{position:absolute;right:8px;top:2px;border:0;background:none;font-size:18px;width:36px;height:30px;cursor:pointer;color:var(--mut)}
#sbody{overflow-y:auto;padding:0 16px 14px;-webkit-overflow-scrolling:touch}
.hd{display:flex;gap:14px;align-items:center}
.ic{font-size:46px;line-height:1}.tp{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.cd{color:var(--mut);font-size:14px}.pl{margin-left:auto;text-align:right;max-width:52%}
.pl b{display:block;font-size:16px}.pl span{display:block;color:var(--mut);font-size:12.5px}
.st{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin:12px 0}
.st div{background:#f2f6f9;border-radius:10px;padding:7px 10px}.st small{display:block;color:var(--mut);font-size:11.5px}
.sp{font-weight:600;margin:6px 0;font-size:13px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.strip div{flex:none;min-width:68px;text-align:center;background:#f2f6f9;border-radius:10px;padding:7px 8px;font-size:13px}
.strip span{display:block;font-size:22px}.strip small{color:var(--mut);display:block;font-size:11.5px}
.ld{padding:22px;text-align:center;color:var(--mut)}
.cl,.rl{background:rgba(255,255,255,.85);border:0;box-shadow:none;font-size:11px;font-weight:600;padding:0 4px;color:#1d2b38}
.cl:before,.rl:before{display:none}.nolbl .cl{display:none}
.sl{background:none;border:0}
.sl span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:700;color:#1d2b38;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 5px #fff;pointer-events:none}
#rtmodal{position:fixed;inset:0;z-index:1300;background:rgba(15,25,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:10vh 12px 12px}
#rtmodal[hidden]{display:none}
.rtbox{position:relative;width:min(100%,420px);padding:18px;display:flex;flex-direction:column;gap:8px}
.rtbox h2{margin:0 0 4px;font-size:18px}.rtbox label{font-size:13px;font-weight:600;color:var(--mut)}
.rtbox input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit}
.rtbox input:focus{outline:2px solid var(--acc);border-color:transparent}
.fld{position:relative}
.sg{position:absolute;top:46px;left:0;right:0;background:#fff;border-radius:10px;box-shadow:var(--sh);display:none;z-index:2;overflow:hidden}
.sg button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;font:inherit;cursor:pointer;border-bottom:1px solid var(--line)}
.sg button:hover{background:#f1f6f9}.sg small{color:var(--mut);display:block}
.rtclose{position:absolute;right:8px;top:8px;border:0;background:none;font-size:18px;cursor:pointer;width:36px;height:36px;color:var(--mut)}
.go{height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.go:disabled{opacity:.45;cursor:default}
.ract{display:flex;justify-content:flex-end;gap:8px;align-items:center;margin-top:6px}
#rmsg{color:#b91c1c;font-size:13px}
#wm{position:absolute;z-index:900;right:10px;bottom:24px;font-size:11px;font-weight:700;letter-spacing:.05em;color:rgba(22,34,46,.6);text-shadow:0 0 3px #fff,0 0 3px #fff;pointer-events:none;user-select:none}
.toast{position:fixed;z-index:1500;left:50%;top:70px;transform:translateX(-50%);padding:10px 16px;background:#16222e;color:#fff;border-radius:10px;font-size:13px;max-width:90%;text-align:center}
@media(max-width:640px){#brand{display:none}#q{height:44px}#bt{height:44px;padding:0 12px}#bt b{display:none}#lgwrap{top:auto;bottom:12px}#sheet{min-height:180px}}
@media(prefers-reduced-motion:reduce){#sheet{transition:none}}

/* ---- mode selector, API status, mode visibility, tracks placeholder ---- */
#modebar{position:absolute;z-index:1001;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:center;pointer-events:none}
#modes{pointer-events:auto;position:relative;display:flex;padding:4px;gap:2px;align-items:center}
#modes button{position:relative;z-index:1;border:0;background:none;font:inherit;font-weight:600;font-size:13px;letter-spacing:.06em;height:34px;min-width:84px;padding:0 14px;border-radius:10px;cursor:pointer;color:var(--mut);transition:color .25s}
#modes button[aria-selected=true]{color:#fff}
#mpill{position:absolute;z-index:0;top:4px;left:4px;height:34px;border-radius:10px;background:var(--acc);transition:transform .28s cubic-bezier(.22,.9,.3,1),width .28s}
#api{pointer-events:auto;position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:11.5px;color:var(--mut);white-space:nowrap}
#api i{width:8px;height:8px;border-radius:50%;background:#9aa7b4}
#api.ok i{background:#22c55e}#api.bk i{background:#f59e0b}#api.err i{background:#ef4444}
.oc-only,.lgship,#lgrail{display:none}#lay .oc-only,#lay .tk-only{display:none}
body.m-oceans .oc-only{display:flex}body.m-oceans #lay .oc-only{display:flex}body.m-oceans .lgship{display:flex}
body.m-tracks #lay .tk-only{display:flex}body.m-tracks #lgrail{display:block}
body.m-oceans .rd-only{display:none!important}
body.m-tracks #rtbtn,body.m-tracks #bt{display:none!important}   /* Tracks: no driving routes, no satellite (imagery shows roads) */
#lgrail{border-top:1px solid #dde4ea;margin-top:4px;padding-top:4px}#lgrail>div{display:flex;align-items:center;gap:8px;padding:4px 0}#lgrail i{width:16px;height:3px;border-radius:2px;flex:none}#lgrail small{color:var(--mut);display:block;font-size:11px;line-height:1.3;width:190px;max-width:100%}
.lgship i{background:#c2255c!important;height:3px!important;border:0!important}
#shbtn{border:0;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink);gap:6px;align-items:center}
#shmodal{position:fixed;inset:0;z-index:1300;background:rgba(15,25,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:8vh 12px 12px;overflow-y:auto}
#shmodal[hidden]{display:none}#shmsg{color:#b91c1c;font-size:13px}
#shrows{display:flex;flex-direction:column;gap:8px}.shrow{display:flex;gap:6px;align-items:flex-end}.shrow .fld{flex:1;display:flex;flex-direction:column;gap:4px}.shrow .sg{top:auto;margin-top:2px}.shdel{height:44px;width:44px;padding:0;text-align:center}
.st.mar{margin:4px 0 10px}.st small.n{color:#a05a00}
.src{color:var(--mut);font-size:11.5px;margin-top:8px}
@media(max-width:640px){#api span{display:none}#api{padding:9px}#modes button{min-width:72px;padding:0 10px}#modebar{justify-content:flex-start}}
@media(max-width:400px){#modes button{min-width:62px;font-size:12px;padding:0 6px}}

/* ---- intro splash: ECOLABS (2 s) then Weather Map poster (3 s); the app loads underneath ---- */
#intro{position:fixed;inset:0;z-index:99999;background:#000;transition:opacity .45s ease;overflow:hidden}
#intro.end{opacity:0;pointer-events:none}
#intro .sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .4s ease}
#intro .sc.on{opacity:1}
#intro .lg{width:min(58vw,300px);height:auto;transform:scale(.94);transition:transform 2s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 0 26px rgba(150,190,255,.1))}
#intro .s1.on .lg{transform:scale(1)}
#intro .brand,#intro .by{font-family:"Michroma","Orbitron","Eurostile","Segoe UI",sans-serif;text-align:center;white-space:nowrap}
#intro .brand{margin-top:clamp(20px,4.5vh,36px);padding-left:.3em;font-size:clamp(26px,7.2vw,54px);letter-spacing:.3em;line-height:1.1;
  background:linear-gradient(100deg,#7d858d 0%,#f6f8fa 32%,#a3abb3 50%,#ffffff 68%,#7d858d 100%);background-size:240% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
#intro .s1.on .brand{animation:introShine 2s ease-in-out both}
@keyframes introShine{from{background-position:100% 0}to{background-position:0 0}}
#intro .by{margin-top:clamp(10px,2.2vh,18px);padding-left:.3em;font-size:clamp(10px,2.5vw,15px);letter-spacing:.32em;color:#8d959d;opacity:0;transition:opacity .6s ease .45s}
#intro .s1.on .by{opacity:1}
#intro .s2 .bgb{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(26px) brightness(.5)}
#intro .s2 img{position:relative;width:100%;height:100%;object-fit:contain}
</style>
</head>

/* Intro timeline: ECOLABS 0–4 s, crossfade to the Weather Map poster, hold until 9 s, fade out. Runs immediately and does not delay the app, which keeps loading underneath. */
(()=>{const I=document.getElementById("intro"),s1=I.querySelector(".s1"),s2=I.querySelector(".s2");
 s2.querySelector(".bgb").style.backgroundImage='url("'+s2.querySelector("img").src+'")';
 const font=document.fonts?document.fonts.load("1em Michroma").catch(()=>{}):Promise.resolve();   // avoid a fallback-font flash, but wait at most 0.6 s
 Promise.race([font,new Promise(r=>setTimeout(r,600))]).then(()=>s1.classList.add("on"));
 setTimeout(()=>{s1.classList.remove("on");s2.classList.add("on")},4000);
 setTimeout(()=>I.classList.add("end"),9000);
 setTimeout(()=>I.remove(),9500);
})();
</script>

    sc2.drawImage(m,0,0,gw,gh);const d=sc2.getImageData(0,0,gw,gh).data;

  /* Sample points on a coarse grid, keeping only those near land. */
  samplePts(){
    const out=[],[W,S,E,N]=this.b,sp=this.sp,r=Math.ceil(sp*.55/this.step),{gw,gh}=this;
    for(let la=Math.ceil(S/sp)*sp;la<=N;la+=sp)for(let lo=Math.ceil(W/sp)*sp;lo<=E;lo+=sp){
      const [ci,cj]=this.cellOf({lat:la,lng:lo});let ok=0;
      for(let j=Math.max(0,cj-r);j<=Math.min(gh-1,cj+r)&&!ok;j++)for(let i=Math.max(0,ci-r);i<=Math.min(gw-1,ci+r);i++)if(this.inside[j*gw+i]){ok=1;break}

  async load(force){
    if(this.busy)return;this.busy=true;this.fail=false;setStatus("load");
    try{
      const key="iwm3_"+this.id;
      if(!force){try{const c=JSON.parse(localStorage.getItem(key)||"null");
        if(c&&Date.now()-c.t<TTL&&c.pts.length){this.pts=c.pts;this.last=c.t;this.render();return}}catch(e){}}
      const P=this.samplePts(),got=[];
      for(let k=0;k<P.length;k+=CHUNK){
        if(k)await sleep(P.length>150?2500:500);
        const ch=P.slice(k,k+CHUNK);
        try{(await fetchChunk(ch)).forEach((o,i)=>{const c=o.current;
          if(c&&c.temperature_2m!=null){const p={lat:ch[i][0],lon:ch[i][1],t:c.temperature_2m,code:c.weather_code,pr:c.precipitation||0,cl:c.cloud_cover||0,day:c.is_day};p.k=ptCat(p);got.push(p)}})}
        catch(e){this.fail=true}
        if(got.length){this.pts=got.slice();this.render()}  // progressive display
      }
      if(!got.length)throw new Error("no data");
      this.last=Date.now();
      try{localStorage.setItem(key,JSON.stringify({t:this.last,pts:this.pts}))}catch(e){}
    }catch(e){console.error(e);this.fail=true}
    finally{this.busy=false;syncStatus()}
  }
  /* IDW-interpolate to every cell, vote for one of six weather types, mode-filter to merge neighbours,
     then paint, smooth, and clip to land. */
  render(){
    if(!this.pts.length)return;
    const {gw,gh,pts,rowLat,W,step}=this,raw=new Uint8Array(gw*gh),T=new Float32Array(gw*gh),D=[0,0,0,0],I=[0,0,0,0];
    for(let j=0;j<gh;j++){const lat=rowLat[j],kx=Math.cos(lat*R);
      for(let i=0;i<gw;i++){
        const lon=W+(i+.5)*step;D.fill(1e9);
        for(let n=0;n<pts.length;n++){const p=pts[n],dx=(p.lon-lon)*kx,dy=p.lat-lat,d=dx*dx+dy*dy;
          if(d<D[3]){let m=3;while(m>0&&D[m-1]>d){D[m]=D[m-1];I[m]=I[m-1];m--}D[m]=d;I[m]=n}}
        const V=[0,0,0,0,0,0,0];let sw=0,t=0,cl=0;
        for(let m=0;m<4;m++){if(D[m]>=1e9)continue;const p=pts[I[m]],w=1/(D[m]+.05);sw+=w;t+=w*p.t;cl+=w*p.cl;V[p.k]+=w}
        let best=-1,bv=0;
        for(const k of [K.STM,K.SNW,K.RAIN,K.DRZ])if(V[k]>=.4*sw&&V[k]>bv){best=k;bv=V[k]}
        if(best<0&&V[K.RAIN]+V[K.DRZ]>=.5*sw)best=V[K.RAIN]>=V[K.DRZ]?K.RAIN:K.DRZ;
        if(best<0)best=cl/sw>=55?K.CLD:(V[K.NIT]>V[K.SUN]?K.NIT:K.SUN);
        raw[j*gw+i]=best;T[j*gw+i]=t/sw;
      }}
    this.cls=this.modeFilter(this.modeFilter(raw,this.sm[0]),this.sm[1]);this.tmp=T;
    const s=document.createElement("canvas");s.width=gw;s.height=gh;const sc=s.getContext("2d"),im=sc.createImageData(gw,gh);
    const rgb=CL.map(c=>[1,3,5].map(o=>parseInt(c[1].substr(o,2),16)));
    for(let k=0;k<gw*gh;k++){const c=rgb[this.cls[k]];im.data.set([c[0],c[1],c[2],this.cls[k]===K.NIT?0:255],k*4)}
    sc.putImageData(im,0,0);

    oc.imageSmoothingEnabled=true;oc.imageSmoothingQuality="high";oc.drawImage(s,0,0,o.width,o.height);

    const url=o.toDataURL("image/png");
    if(this.ov)this.ov.setUrl(url);else this.ov=L.imageOverlay(url,[[this.S,this.W],[this.b[3]>0?invY(this.yTop):this.b[3],this.E]],{pane:"wx",opacity:.62,interactive:false});
    applyLayers();
  }
  modeFilter(a,r){
    const {gw,gh}=this,out=new Uint8Array(a.length),cnt=new Uint16Array(CL.length);
    for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){
      cnt.fill(0);
      for(let y=Math.max(0,j-r);y<=Math.min(gh-1,j+r);y++)for(let x=Math.max(0,i-r);x<=Math.min(gw-1,i+r);x++)cnt[a[y*gw+x]]++;
      let b=a[j*gw+i];for(let n=0;n<cnt.length;n++)if(cnt[n]>cnt[b])b=n;out[j*gw+i]=b;
    }
    return out;
  }
  /* Flood-fill the connected zone of identical weather under a click and summarise it. */
  regionAt(ll,quick){
    if(!this.cls)return null;
    const {gw,gh,cls,inside}=this,[i,j]=this.cellOf(ll);
    if(i<0||j<0||i>=gw||j>=gh||!inside[j*gw+i])return null;
    if(quick)return true;
    const c0=cls[j*gw+i],seen=new Uint8Array(gw*gh),st=[j*gw+i],cells=[];seen[st[0]]=1;
    while(st.length){const k=st.pop();cells.push(k);const x=k%gw,y=(k/gw)|0;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=gw||ny>=gh)continue;
        const n=ny*gw+nx;if(!seen[n]&&inside[n]&&cls[n]===c0){seen[n]=1;st.push(n)}}}
    let sum=0,mn=99,mx=-99,area=0;

    const cnt={},step=Math.max(1,Math.floor(cells.length/60));
    for(let n=0;n<cells.length;n+=step){const k=cells[n],x=this.W+((k%gw)+.5)*this.step,y=this.rowLat[(k/gw)|0],pt=turf.point([x,y]);
      for(const it of this.items){const b=it.f._bb;if(x<b[0]||x>b[2]||y<b[1]||y>b[3])continue;
        if((it.lo!=null&&x<it.lo)||(it.hi!=null&&x>it.hi))continue;
        if(turf.booleanPointInPolygon(pt,it.f)){cnt[it.name]=(cnt[it.name]||0)+1;break}}}
    const tot=Object.values(cnt).reduce((a,b)=>a+b,0)||1;
    const names=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).filter(e=>e[1]/tot>=.15).slice(0,3).map(e=>e[0]);
    return{cls:c0,n:cells.length,avg:sum/cells.length,mn,mx,area,names};
  }
  /* State/country name labels: placed on the largest polygon; bigger areas appear at lower zoom. */
  buildLabels(){

      const g=it.f.geometry,polys=g.type==="Polygon"?[g.coordinates]:g.coordinates;let best=null,ba=-1;
      polys.forEach(p=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;p[0].forEach(a=>{x0=Math.min(x0,a[0]);x1=Math.max(x1,a[0]);y0=Math.min(y0,a[1]);y1=Math.max(y1,a[1])});
        const a=(x1-x0)*(y1-y0);if(a>ba){ba=a;best=p}});
      let pt;try{pt=turf.pointOnFeature(turf.polygon(best)).geometry.coordinates}catch(e){continue}
      if((it.lo!=null&&pt[0]<it.lo)||(it.hi!=null&&pt[0]>it.hi))continue;
      const z=this.id==="sub"&&!it.world?(ba>30?3.5:ba>10?4.5:ba>3?5:5.5):(ba>400?2:ba>100?3:ba>25?4:ba>6?5:5.5);
      const m=L.marker([pt[1],pt[0]],{icon:L.divIcon({className:"sl",html:`<span>${esc(it.name)}</span>`,iconSize:[0,0]}),interactive:false,keyboard:false});
      this.labels.push({m,z});

}

/* ================= ZONE MANAGEMENT ================= */
function getZone(id){
  let z=zones.find(q=>q.id===id);if(z)return z;
  const mk=(f,x)=>Object.assign({f,name:stName(f.properties)},x||{});
  const W=world?world.features.filter(f=>A3(f)!=="IND"&&A3(f)!=="ATA"):[];let items;
  if(id==="sub")items=states.features.map(f=>mk(f)).concat(W.filter(f=>SUBC.includes(A3(f))).map(f=>mk(f,{world:1})));
  else if(id==="asia")items=W.filter(f=>CONT(f)==="Asia"&&!SUBC.includes(A3(f))).map(f=>mk(f,{world:1})).concat(W.filter(f=>A3(f)==="RUS").map(f=>mk(f,{world:1,lo:60})));
  else if(id==="eu")items=W.filter(f=>CONT(f)==="Europe"&&A3(f)!=="RUS").map(f=>mk(f,{world:1})).concat(W.filter(f=>A3(f)==="RUS").map(f=>mk(f,{world:1,hi:60})));
  else items=W.filter(f=>CONT(f)==={na:"North America",sa:"South America",af:"Africa",oc:"Oceania"}[id]).map(f=>mk(f,{world:1}));
  items.forEach(it=>{if(!it.f._bb)it.f._bb=turf.bbox(it.f)});
  z=new Zone(id,items);zones.push(z);return z;
}
function setZone(id,on,fly){
  const z=getZone(id);z.on=on;
  document.querySelector(`.chip[data-z=${id}]`).setAttribute("aria-pressed",on);
  if(on){if(!z.labels)z.buildLabels();z.load(false);if(fly)map.flyToBounds([[z.S,z.W],[z.b[3],z.E]],{padding:[10,10],duration:1})}
  applyLayers();
}
function applyLayers(){
  if(NT.ov)F.nt?NT.ov.addTo(map):map.removeLayer(NT.ov);
  zones.forEach(z=>{
    if(z.ov)(MODE!=="oceans"&&z.on&&F.wx)?z.ov.addTo(map):map.removeLayer(z.ov);
    (MODE!=="oceans"&&z.on&&F.bd)?z.lines.addTo(map):map.removeLayer(z.lines);
  });
  updateLabels();
  if(typeof ocApply==="function"&&typeof OC!=="undefined")ocApply();
  if(typeof railApply==="function"&&typeof RL!=="undefined")railApply();
}
function updateLabels(){
  if(!map)return;const z=map.getZoom();
  map.getContainer().classList.toggle("nolbl",z<6.5);
  (MODE!=="oceans"&&F.ct&&z>=6.5)?map.cities.addTo(map):map.removeLayer(map.cities);   // city dots/names only when zoomed in
  zones.forEach(q=>{if(!q.labels)return;
    q.labels.forEach(l=>{const want=MODE!=="oceans"&&q.on&&F.bd&&z<6.5&&z>=l.z,has=q.lg.hasLayer(l.m);
      if(want&&!has)q.lg.addLayer(l.m);else if(!want&&has)q.lg.removeLayer(l.m)})});
}
const zoneAt=(ll,quick)=>{if(MODE==="oceans"||!F.wx)return null;for(const z of zones)if(z.on&&z.cls){const r=z.regionAt(ll,quick);if(r)return r}return null};

/* ================= MAP INIT ================= */
function initMap(){
  map=L.map("map",{zoomControl:false,zoomSnap:.5,minZoom:2,maxBounds:[[-85,-180],[85,180]],maxBoundsViscosity:1});
  map.createPane("night").style.zIndex=250;               // night shading: above tiles, below weather colours
  map.createPane("wx").style.zIndex=300;                       // weather colours: above tiles, below lines/labels
  const rp=map.createPane("ref");rp.style.zIndex=350;rp.style.pointerEvents="none";
  const o={maxZoom:18,noWrap:true,bounds:[[-85,-180],[85,180]]};
  map.bases={
    street:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{...o,attribution:"Tiles © Esri"}),
    sat:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{...o,maxNativeZoom:17,attribution:"Imagery © Esri"}),
    terr:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}",{...o,maxNativeZoom:13,attribution:"Terrain © Esri"})};   // Tracks mode: no roads
  map.ref=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{...o,pane:"ref"});
  let bad=0;Object.values(map.bases).forEach(l=>l.on("tileerror",()=>{if(++bad===10)toast("Base map tiles are failing to load")}));
  setSat(false);
  map.cities=L.layerGroup();
  CITIES.forEach(([n,la,lo])=>{
    L.circleMarker([la,lo],{radius:4,color:"#16222e",weight:1.5,fillColor:"#fff",fillOpacity:1})
     .bindTooltip(n,{permanent:true,direction:"right",offset:[5,0],className:"cl"})
     .on("click",e=>{L.DomEvent.stop(e);select(L.latLng(la,lo),n)}).addTo(map.cities);
  });
  map.on("zoomend",updateLabels);
  map.on("click",e=>pick(e.latlng));   // tap anywhere: weather for that exact point
  map.on("mousemove",e=>{map.getContainer().style.cursor=MODE==="oceans"?(isWater(e.latlng)?"pointer":""):zoneAt(e.latlng,true)?"pointer":""});
  resetView();updateLabels();
}
function setSat(on){
  sat=on;if(map.cur)map.cur.remove();
  const tk=MODE==="tracks";
  map.cur=(tk?map.bases.terr:on?map.bases.sat:map.bases.street).addTo(map);map.cur.bringToBack();
  (on||tk)?map.ref.addTo(map):map.ref.remove();   // satellite imagery has no labels, so add Esri's place-name layer
  $("bt").innerHTML=on?"<span>🗺️</span><b>Map</b>":"<span>🛰️</span><b>Satellite</b>";
}
const resetView=()=>map.fitBounds([[6.5,68],[37.3,97.5]],{padding:[10,10]});

/* ================= BOUNDARY DATA ================= */
async function loadJSON(urls,test){
  for(const u of urls){try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();if(test(j))return j}catch(e){}}
  return null;
}

/* ================= DETAIL FETCH + PANEL ================= */
const sheet=$("sheet");
const openSheet=(h,big)=>{sheet.classList.toggle("big",!!big);$("sbody").innerHTML=h;sheet.style.transform="";sheet.classList.add("open")};
const closeSheet=()=>{sheet.classList.remove("open");sheet.style.transform="";if(hl){map.removeLayer(hl);hl=null}};
function nearestCity(ll){let b=null,bd=1e9;
  ALLC.forEach(c=>{const d=turf.distance([ll.lng,ll.lat],[c[2],c[1]]);if(d<bd){bd=d;b=c[0]}});return[b,Math.round(bd)]}
/* Reverse geocoding: names the tapped village/town/city and its state. Esri first, BigDataCloud as backup. Never throws. */
const placeCache={};
async function placeInfo(ll){
  const key=ll.lat.toFixed(3)+","+ll.lng.toFixed(3);if(key in placeCache)return placeCache[key];
  const get=async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);
    try{const r=await fetch(u,{signal:c.signal});return r.ok?await r.json():null}catch(e){return null}finally{clearTimeout(t)}};
  let out=null;
  const e=await get(`https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/reverseGeocode?f=json&featureTypes=Locality&langCode=en&location=${ll.lng},${ll.lat}`);
  const a=e&&!e.error&&e.address;
  if(a&&(a.City||a.Match_addr))out={name:a.City||a.Match_addr,district:a.Subregion||"",state:a.Region||"",country:""};
  const b=await get(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${ll.lat}&longitude=${ll.lng}&localityLanguage=en`);
  if(b){out=out||{name:b.locality||b.city||"",district:"",state:"",country:""};
    out.state=out.state||b.principalSubdivision||"";out.country=b.countryName||"";out.name=out.name||b.locality||b.city||""}
  if(out&&!out.name&&!out.state&&!out.country)out=null;
  return placeCache[key]=out;
}
/* Fallback: which state/country polygon contains the point (same data as the map borders). */
function polityAt(ll){
  const pt=turf.point([ll.lng,ll.lat]);
  for(const z of zones)if(z.on)for(const it of z.items){const bb=it.f._bb;
    if(ll.lng<bb[0]||ll.lng>bb[2]||ll.lat<bb[1]||ll.lat>bb[3])continue;
    if((it.lo!=null&&ll.lng<it.lo)||(it.hi!=null&&ll.lng>it.hi))continue;
    if(turf.booleanPointInPolygon(pt,it.f))return{name:it.name,world:!!it.world}}
  return null;
}
/* One entry point for 'user chose a point': land weather in Roads, marine weather in Oceans, nothing in Tracks. */
function pick(ll,label,me){if(MODE==="oceans")return selectOcean(ll,label);return select(ll,label,me)}
async function select(ll,label,me){
  const tok=++selTok;
  if(hl)map.removeLayer(hl);
  hl=L.circleMarker(ll,{radius:9,color:"#fff",weight:3,fillColor:"#0f6b8f",fillOpacity:1}).addTo(map);
  openSheet('<div class="ld">Loading weather data...</div>');
  const pt=map.latLngToContainerPoint(ll),H=map.getSize().y;       // keep the chosen point visible above the sheet
  if(pt.y>H*.5)map.panBy([0,pt.y-H*.3]);
  const reg=zoneAt(ll);
  try{const [d,pi]=await Promise.all([getDetail(ll),placeInfo(ll)]);if(tok!==selTok)return;openSheet(panelHTML(d,ll,label,reg,pi,me))}
  catch(e){if(tok===selTok)openSheet('<div class="ld">Weather data temporarily unavailable</div>')}
}
function panelHTML(d,ll,label,reg,pi,me){
  const c=d.current,h=d.hourly,dd=d.daily,w=WMO[c.weather_code]||["❔","Unknown"];
  const ic=c.weather_code===0&&!c.is_day?"🌙":w[0];
  let i0=h.time.findIndex(t=>t>=c.time.slice(0,13)+":00");if(i0<0)i0=0;
  const f=v=>v==null?"–":Math.round(v),dirs=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  const vis=h.visibility[i0],pp=h.precipitation_probability[i0],[city,km]=nearestCity(ll);
  const po=polityAt(ll),state=(pi&&pi.state)||(po&&!po.world?po.name:""),country=(pi&&pi.country)||(po?(po.world?po.name:"India"):"");
  const title=label||(pi&&pi.name)||(km<=25?city:"")||state||country||"Selected location";
  const where=[me?"Your location":"",pi&&pi.district,state,country].filter((v,i,a)=>v&&v!==title&&a.indexOf(v)===i).join(", ");
  const sub=reg?`${CL[reg.cls][0]} zone · similar weather across ≈${Math.round(reg.area/100)*100} km² (${f(reg.mn)}–${f(reg.mx)}°C)`:"";
  const stat=(a,b)=>`<div><small>${a}</small>${b}</div>`;
  const day=s=>new Date(s+"T12:00").toLocaleDateString("en-IN",{weekday:"short"});
  let hrs="";for(let n=i0;n<Math.min(i0+10,h.time.length);n++){const x=WMO[h.weather_code[n]]||["❔",""];
    hrs+=`<div>${new Date(h.time[n]).toLocaleTimeString("en-IN",{hour:"numeric",hour12:true})}<span>${x[0]}</span><b>${f(h.temperature_2m[n])}°</b><small>${f(h.precipitation_probability[n])}%</small></div>`}
  let days="";dd.time.forEach((t,n)=>{const x=WMO[dd.weather_code[n]]||["❔",""];
    days+=`<div>${n?day(t):"Today"}<span>${x[0]}</span><b>${f(dd.temperature_2m_max[n])}°</b><small>${f(dd.temperature_2m_min[n])}° · ${f(dd.precipitation_probability_max[n])}%</small></div>`});
  return `<div class="hd"><div class="ic">${ic}</div><div><div class="tp">${f(c.temperature_2m)}°C</div><div class="cd">${w[1]} · Feels ${f(c.apparent_temperature)}°</div>${dd.time.length?`<div class="cd">High ${f(dd.temperature_2m_max[0])}° · Low ${f(dd.temperature_2m_min[0])}°</div>`:""}</div>
   <div class="pl"><b>${esc(title)}</b>${where?`<span>${esc(where)}</span>`:""}${km<=700?`<span>Nearest major city: ${esc(city)} (≈${km} km)</span>`:""}<span>${ll.lat.toFixed(2)}°, ${ll.lng.toFixed(2)}°</span></div></div>
   ${sub?`<div class="cd" style="margin-top:8px">${esc(sub)}</div>`:""}
   <div class="st">${stat("Humidity",c.relative_humidity_2m==null?"–":f(c.relative_humidity_2m)+"%")}${stat("Wind",c.wind_speed_10m==null?"–":f(c.wind_speed_10m)+" km/h "+(c.wind_direction_10m==null?"":dirs[Math.round(c.wind_direction_10m/22.5)%16]))}${stat("Cloud cover",c.cloud_cover==null?"–":f(c.cloud_cover)+"%")}${stat("Rain chance",pp==null?"–":f(pp)+"%")}${stat("Precipitation",c.precipitation==null?"–":c.precipitation+" mm")}${stat("Pressure",c.pressure_msl==null?"–":f(c.pressure_msl)+" hPa")}${stat("Visibility",vis==null?"–":(vis/1000).toFixed(1)+" km")}</div>

function locate(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation){toast("Location is not available in this browser");return rej()}
    navigator.geolocation.getCurrentPosition(p=>{
      const ll=L.latLng(p.coords.latitude,p.coords.longitude);

      map.me=L.circleMarker(ll,{radius:8,color:"#fff",weight:3,fillColor:"#2563eb",fillOpacity:1,interactive:false}).addTo(map);

/* Moving-car energy model: constant 100 km/h; solar roof 2.5 m² + hood 1.3 m² at 20%; two internal front-duct turbines (120 W at 100 km/h relative airflow, capped 158 W); TEG fixed at 10 W. */
const CAR={speedKmh:100,roofM2:2.5,hoodM2:1.3,solarEff:.20,peakIrr:1000,turbBaseW:120,turbCapW:158,tegW:10};
CAR.solarM2=CAR.roofM2+CAR.hoodM2;                                               // 3.8 m² (max 760 W at 1,000 W/m²)
const SOLAR_FALLBACK={sunny:1,cloudy:.5,drizzle:.35,rain:.2,storm:.08};           // used only when the API has no irradiance value
const solarKind=c=>c>=95?"storm":((c>=61&&c<=67)||(c>=80&&c<=82)||(c>=71&&c<=77)||c===85||c===86)?"rain":(c>=51&&c<=57)?"drizzle":(c===0||c===1)?"sunny":"cloudy";

const fmtDur=h=>{const m=Math.round(h*60);return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`};
const fmtBoth=e=>`${Math.round(e).toLocaleString()} Wh (${(e/1000).toFixed(2)} kWh)`;
async function carEstimate(ll,distM,durS){
  // Energy uses the DRIVING time at a constant 100 km/h (distance ÷ 100), not the road ETA (which includes traffic and slow roads).
  const distKm=distM/1000,hrs=distKm/CAR.speedKmh;
  // split the route into n equal segments; each is sampled at its middle with its direction of travel
  const cum=[0];for(let i=1;i<ll.length;i++)cum.push(cum[i-1]+carHav(ll[i-1],ll[i]));
  const total=cum[cum.length-1],n=Math.max(3,Math.min(15,Math.round(total/40000))),P=[];
  const segKm=distKm/n,segH=segKm/CAR.speedKmh;                                  // each segment: distance covered, and time to cover it at 100 km/h
  // TEG: constant 10 W, energy summed per segment. Turbine fallback (no weather/wind data): zero ambient wind → 100 km/h airflow.
  let tegE=0,wFbE=0;for(let s=0;s<n;s++){tegE+=CAR.tegW*segH;wFbE+=turbineW(100)*segH}
  const out={hrs,distKm,heat:{p:CAR.tegW,e:tegE,avg:tegE/hrs},wx:null,wind:{e:wFbE,avg:wFbE/hrs,vrel:100,along:0,fb:true}};
  for(let s=0;s<n;s++){let k=cum.findIndex(c=>c>=(s+.5)/n*total);if(k<1)k=1;
    P.push({p:ll[k],hd:carBearing(ll[Math.max(0,k-3)],ll[Math.min(ll.length-1,k+3)])})}
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${P.map(x=>x.p[0].toFixed(3)).join(",")}&longitude=${P.map(x=>x.p[1].toFixed(3)).join(",")}&hourly=temperature_2m,weather_code,shortwave_radiation,wind_speed_10m,wind_direction_10m,is_day&wind_speed_unit=ms&forecast_days=3&timezone=GMT`;
    const r=await fetch(u,{signal:AbortSignal.timeout?AbortSignal.timeout(15000):undefined});if(!r.ok)throw 0;let j=await r.json();if(!Array.isArray(j))j=[j];
    const now=Date.now();let sE=0,wE=0,day=0,ghiSum=0,ghiN=0,fbN=0,vSum=0,aSum=0;
    const pick=(h,t)=>Math.max(0,Math.min(h.time.length-1,Math.round((t-Date.parse(h.time[0]+"Z"))/36e5)));
    P.forEach((q,s)=>{
      const h=j[s].hourly,i=pick(h,now+(s+.5)*segH*36e5);q.i=i;q.h=h;

      const isDay=h.is_day[i]===1,irr=h.shortwave_radiation[i];let ghi;

      sE+=CAR.solarM2*ghi*CAR.solarEff*segH;                                      // Solar = 3.8 × irradiance × 0.20
      // TURBINES: wind blows FROM wd; 'along' = wind component along our heading (+ = tailwind), so relative airflow = 100 − along
      const ws=h.wind_speed_10m[i],wd=h.wind_direction_10m[i];let along=0,vrel=CAR.speedKmh;
      if(ws!=null&&wd!=null&&isFinite(ws)&&isFinite(wd)){

      solar:{e:sE,avg:sE/hrs},wind:{e:wE,avg:wE/hrs,vrel:vSum/n,along:aSum/n,fb:false},
      ends:[0,n-1].map(k=>{const h=P[k].h,i=P[k].i;return`${(WMO[h.weather_code[i]]||["❔"])[0]} ${Math.round(h.temperature_2m[i])}°C`})};
  }catch(e){console.error(e)}

}

   <div class="pw">${sol}${wnd}${heat}${tot}</div>

/* ================= NIGHT SHADING (from the sun's position, covers land and oceans) ================= */
const NT={ov:null};
function drawNight(){
  const now=new Date(),yT=mercY(85),w=720,dy=.5*R,h=Math.ceil(2*yT/dy);
  const N=(now-Date.UTC(now.getUTCFullYear(),0,0))/864e5,B=2*Math.PI*(N-81)/364;
  const eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);               // equation of time (minutes)
  const dec=23.44*R*Math.sin(2*Math.PI*(N-81)/365),utc=now.getUTCHours()+now.getUTCMinutes()/60;
  const subLon=-15*(utc-12+eot/60),sd=Math.sin(dec),cd=Math.cos(dec);          // longitude where the sun is overhead
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d"),im=x.createImageData(w,h);
  for(let j=0;j<h;j++){
    const lat=invY(yT-(j+.5)*dy)*R,sl=Math.sin(lat)*sd,cl=Math.cos(lat)*cd;
    for(let i=0;i<w;i++){
      const lon=-180+(i+.5)*360/w,alt=Math.asin(Math.max(-1,Math.min(1,sl+cl*Math.cos((lon-subLon)*R))))/R;
      const t=Math.max(0,Math.min(1,(4-alt)/14)),k=(j*w+i)*4;                  // smooth twilight: lit above 4°, dark below −10°
      im.data[k]=8;im.data[k+1]=14;im.data[k+2]=44;im.data[k+3]=Math.round(t*t*(3-2*t)*150);
    }
  }
  x.putImageData(im,0,0);
  const url=c.toDataURL("image/png"),b=[[invY(yT-h*dy),-180],[85,180]];
  if(NT.ov){NT.ov.setUrl(url);NT.ov.setBounds(b)}else NT.ov=L.imageOverlay(url,b,{pane:"night",interactive:false});
  applyLayers();
}

/* ================= OCEANS MODE + MODE SWITCHING =================

 "https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_110m_geography_marine_polys.geojson",
 "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_geography_marine_polys.geojson"];

const DENSE=[[-6,30,36,46,2.5],[32,11,57,30,2],[55,5,100,25,4],[99,0,142,42,3],[-98,8,-60,30,3.5],[-5,51,30,66,2.5],[27,41,42,47,2],[105,-10,135,8,3]];
function ocSamples(){
  const out=[],seen=new Set(),add=(la,lo,t)=>{const k=la.toFixed(1)+","+lo.toFixed(1);if(seen.has(k))return;seen.add(k);if(isWater({lat:la,lng:lo}))out.push({la,lo,t})};

/* ---- load (progressive, cached) ---- */
async function ocLoad(force){
  if(OC.busy||!OC.samples)return;OC.busy=true;OC.fail=false;setStatus("load");
  const key="iwm4_ocean";
  try{
    if(!force){try{const c=JSON.parse(localStorage.getItem(key)||"null");
      if(c&&Date.now()-c.t<TTL&&c.pts&&c.pts.length>50){OC.pts=c.pts;OC.last=c.t;OC.have=new Set(c.pts.map(p=>p.lat+","+p.lon));ocRender();return}}catch(e){}}
    if(force){OC.have=new Set();}
    const todo=OC.samples.filter(s=>!OC.have.has(s.la+","+s.lo));let got=force?[]:OC.pts.slice(),first=true,all=true;
    for(let k=0;k<todo.length;k+=CHUNK){
      if(MODE!=="oceans"){all=false;break}                      // user left Oceans: stop requesting
      if(!first)await sleep(4000);first=false;
      const ch=todo.slice(k,k+CHUNK);
      try{(await fetchChunk(ch.map(s=>[s.la,s.lo]),"sea-grid")).forEach((o,i)=>{const c=o.current;
        if(c&&c.temperature_2m!=null){const p={lat:ch[i].la,lon:ch[i].lo,t:c.temperature_2m,code:c.weather_code,pr:c.precipitation||0,cl:c.cloud_cover||0,day:c.is_day};p.k=ptCat(p);got.push(p);OC.have.add(p.lat+","+p.lon)}})}
      catch(e){OC.fail=true;all=false}
      OC.pts=got.slice();if(got.length)ocRender();
    }
    if(!got.length)throw new Error("no data");
    if(all){OC.last=Date.now();try{localStorage.setItem(key,JSON.stringify({t:OC.last,pts:OC.pts}))}catch(e){}}
    else if(!OC.last&&got.length)OC.last=Date.now();
  }catch(e){console.error(e);OC.fail=true}
  finally{OC.busy=false;ocSyncStatus()}
}
/* IDW over a spatial hash (8° bins) -> weather type per cell -> mode filter -> paint -> clip to water. */
function ocRender(){
  const pts=OC.pts;if(!pts.length||!OC.mask)return;
  const {gw,gh,step}=OC,raw=new Uint8Array(gw*gh),BN=8,NX=45,NY=23,bins=Array.from({length:NX*NY},()=>[]);
  pts.forEach((p,n)=>bins[Math.min(NY-1,Math.max(0,Math.floor((p.lat+90)/BN)))*NX+Math.min(NX-1,Math.max(0,Math.floor((p.lon+180)/BN)))].push(n));
  const D=[0,0,0,0],I=[0,0,0,0];
  for(let j=0;j<gh;j++){const lat=OC.rowLat[j],kx=Math.cos(lat*R),by=Math.min(NY-1,Math.max(0,Math.floor((lat+90)/BN)));
    for(let i=0;i<gw;i++){
      const lon=-180+(i+.5)*step,bx=Math.floor((lon+180)/BN);
      const scan=r=>{D.fill(1e9);for(let dy=-r;dy<=r;dy++){const y=by+dy;if(y<0||y>=NY)continue;
        for(let dx=-r;dx<=r;dx++)for(const n of bins[y*NX+(((bx+dx)%NX)+NX)%NX]){const p=pts[n];let dl=Math.abs(p.lon-lon);if(dl>180)dl=360-dl;
          const a=dl*kx,b=p.lat-lat,d=a*a+b*b;
          if(d<D[3]){let m=3;while(m>0&&D[m-1]>d){D[m]=D[m-1];I[m]=I[m-1];m--}D[m]=d;I[m]=n}}}};
      scan(2);if(D[3]>=1e9)scan(6);if(D[3]>=1e9)scan(23);
      const V=[0,0,0,0,0,0,0];let sw=0,cl=0;
      for(let m=0;m<4;m++){if(D[m]>=1e9)continue;const p=pts[I[m]],w=1/(D[m]+.05);sw+=w;cl+=w*p.cl;V[p.k]+=w}
      let best=-1,bv=0;
      for(const k of [K.STM,K.SNW,K.RAIN,K.DRZ])if(V[k]>=.4*sw&&V[k]>bv){best=k;bv=V[k]}
      if(best<0&&V[K.RAIN]+V[K.DRZ]>=.5*sw)best=V[K.RAIN]>=V[K.DRZ]?K.RAIN:K.DRZ;
      if(best<0)best=cl/sw>=55?K.CLD:(V[K.NIT]>V[K.SUN]?K.NIT:K.SUN);
      raw[j*gw+i]=best;
    }}
  const g={gw,gh},cls=Zone.prototype.modeFilter.call(g,Zone.prototype.modeFilter.call(g,raw,3),2);
  const s=document.createElement("canvas");s.width=gw;s.height=gh;const sx=s.getContext("2d"),im=sx.createImageData(gw,gh);
  const rgb=CL.map(c=>[1,3,5].map(o=>parseInt(c[1].substr(o,2),16)));
  for(let k=0;k<gw*gh;k++){const c=rgb[cls[k]];im.data.set([c[0],c[1],c[2],cls[k]===K.NIT?0:255],k*4)}
  sx.putImageData(im,0,0);
  const o=document.createElement("canvas");o.width=gw*OC.sc;o.height=gh*OC.sc;const oc=o.getContext("2d");
  oc.imageSmoothingEnabled=true;oc.imageSmoothingQuality="high";oc.drawImage(s,0,0,o.width,o.height);
  oc.globalCompositeOperation="destination-in";oc.drawImage(OC.mask,0,0);
  const url=o.toDataURL("image/png");
  if(OC.ov)OC.ov.setUrl(url);else OC.ov=L.imageOverlay(url,OC.bounds,{pane:"wx",opacity:.62,interactive:false});
  ocApply();
}
function ocSyncStatus(){
  if(OC.busy)return;$("ref").classList.remove("spin");
  if(OC.pts.length){setStatus("ok");if(OC.fail)toast("Some ocean areas could not be loaded")}
  else{setStatus("err");toast("Ocean weather temporarily unavailable")}
}

   Zoomed out (< 7): Natural Earth world railroads (one static file, no passenger/cargo information -> drawn as "mixed").
   Zoomed in (>= 7): OpenStreetMap railways fetched per map cell from Overpass (several mirrors with failover), classified from OSM tags. */
const RAIL_NE=[
 "https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_10m_railroads.geojson",
 "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_railroads.geojson"];
const RAIL_OP=[{id:"op1",name:"Overpass (overpass-api.de)",url:"https://overpass-api.de/api/interpreter"},
 {id:"op2",name:"Overpass (kumi.systems)",url:"https://overpass.kumi.systems/api/interpreter"},
 {id:"op3",name:"Overpass (private.coffee)",url:"https://overpass.private.coffee/api/interpreter"}];
const RAIL_COL="#e11d48";   // one railway style: bold pink-red with a white outline, distinct from the dark borders and the weather colours
const RAIL_TIERS=[
 {id:"a",z:7,cell:3,w:2,q:'["railway"="rail"]["usage"="main"][!"service"]'},
 {id:"b",z:8,cell:2,w:2.4,q:'["railway"="rail"]["usage"~"^(main|branch)$"][!"service"]'},
 {id:"c",z:10,cell:1,w:2.8,q:'["railway"~"^(rail|narrow_gauge|light_rail|subway)$"][!"service"]'},
 {id:"d",z:12,cell:.25,w:3.4,q:'["railway"~"^(rail|narrow_gauge|light_rail|subway)$"]'}];
const RL={cells:new Map(),busy:new Set(),fail:new Map(),queue:[],active:0,ne:null,neP:null,r:null,warned:0,tm:0};
function railPane(){if(!map.getPane("rail")){const p=map.createPane("rail");p.style.zIndex=335;p.style.pointerEvents="none"}return RL.r||(RL.r=L.canvas({pane:"rail",padding:.4}))}
function railWant(){
  const z=Math.floor(map.getZoom()),t=RAIL_TIERS.slice().reverse().find(t=>z>=t.z);if(!t)return null;
  const b=map.getBounds(),c=t.cell,ctr=map.getCenter(),cells=[];
  const i0=Math.floor((b.getWest()+180)/c),i1=Math.floor((b.getEast()+180)/c),j0=Math.floor((Math.max(-89,b.getSouth())+90)/c),j1=Math.floor((Math.min(89,b.getNorth())+90)/c);
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++)cells.push({k:t.id+":"+i+":"+j,i,j,t,d:Math.hypot((i+.5)*c-180-ctr.lng,(j+.5)*c-90-ctr.lat)});
  return{t,cells:cells.sort((a,b)=>a.d-b.d).slice(0,20)};
}
async function railLoad(cell){
  const {t,i,j}=cell,c=t.cell,s=j*c-90,w=i*c-180,q=`[out:json][timeout:60];way${t.q}(${s},${w},${s+c},${w+c});out skel geom qt;`;
  const d=await chain("rail",RAIL_OP,p=>jget(p.url+"?data="+encodeURIComponent(q),70000).then(r=>{
    if(!r||!Array.isArray(r.elements))throw new Error("invalid data");
    if(r.remark&&/error|timed out/i.test(r.remark))throw new Error("overpass: "+r.remark);return r}));
  const rec={g:L.layerGroup(),n:0},rd=railPane(),o={pane:"rail",renderer:rd,interactive:false,lineCap:"round",lineJoin:"round",smoothFactor:1.2},cas=[],lin=[];
  d.elements.forEach(el=>{if(el.type!=="way"||!el.geometry||el.geometry.length<2)return;const ll=el.geometry.map(p=>[p.lat,p.lon]);
    cas.push(L.polyline(ll,{...o,color:"#fff",weight:t.w+2,opacity:.85}));lin.push(L.polyline(ll,{...o,color:RAIL_COL,weight:t.w,opacity:1}));rec.n++});
  cas.concat(lin).forEach(l=>rec.g.addLayer(l));                 // white outlines first, coloured lines on top
  return rec;
}
function railPump(){
  while(RL.active<2&&RL.queue.length){
    const c=RL.queue.shift();if(RL.cells.has(c.k)||RL.busy.has(c.k))continue;
    RL.busy.add(c.k);RL.active++;
    railLoad(c).then(rec=>{RL.cells.set(c.k,rec);RL.warned=0})
      .catch(()=>{RL.fail.set(c.k,Date.now());if(!RL.warned){RL.warned=1;toast("Detailed railway data is temporarily unavailable; showing main lines only")}})
      .finally(()=>{RL.busy.delete(c.k);RL.active--;railRender();railPump()});
  }
}
let railTm=0;
function railUpdate(){
  clearTimeout(railTm);railTm=setTimeout(()=>{
    if(MODE!=="tracks")return;
    const w=railWant();RL.queue=[];
    if(w)w.cells.forEach(c=>{if(!RL.cells.has(c.k)&&!RL.busy.has(c.k)&&Date.now()-(RL.fail.get(c.k)||0)>60e3)RL.queue.push(c)});
    railRender();railPump();
  },250);
}
function railRender(){
  const on=MODE==="tracks",w=on?railWant():null,keep=new Set(w?w.cells.map(c=>c.k):[]);
  for(const [k,rec] of RL.cells){(on&&F.rl&&keep.has(k))?rec.g.addTo(map):map.removeLayer(rec.g)}
  if(RL.cells.size>120)for(const [k,rec] of RL.cells){if(RL.cells.size<=100)break;if(!keep.has(k)){map.removeLayer(rec.g);RL.cells.delete(k)}}
  const full=!!w&&w.cells.every(c=>RL.cells.has(c.k));
  if(RL.ne)(on&&F.rl&&!full)?RL.ne.addTo(map):map.removeLayer(RL.ne);     // overview lines until the detailed cells are in
}
const railApply=()=>railRender();
function railEnter(){
  railPane();
  if(map.attributionControl&&!RL.attr){RL.attr=1;map.attributionControl.addAttribution("Railways © OpenStreetMap contributors, Natural Earth")}
  railUpdate();
  if(!RL.neP){RL.neP=loadJSON(RAIL_NE,j=>j&&j.type==="FeatureCollection"&&j.features.length>100).then(j=>{
    if(j)RL.ne=L.geoJSON(j,{pane:"rail",renderer:railPane(),interactive:false,style:{color:RAIL_COL,weight:1.6,opacity:.95}});
    else{RL.neP=null;if(MODE==="tracks")toast("World railway overview could not be loaded — zoom in to load detailed lines")}
    railRender();return j})}
}
function railLeave(){RL.queue=[];railRender()}
function wireRail(){map.on("moveend",railUpdate)}

/* ---- mode switching: one map, layers added/removed, nothing recreated ---- */
function movePill(){const b=document.querySelector(`#modes [data-m=${MODE}]`),p=$("mpill");if(!b)return;p.style.width=b.offsetWidth+"px";p.style.transform=`translateX(${b.offsetLeft-4}px)`}
function setMode(m){
  if(m===MODE)return;
  const prev=MODE;MODE=m;selTok++;closeSheet();closeRoute();srClose();
  document.body.classList.remove("m-roads","m-oceans","m-tracks");document.body.classList.add("m-"+m);
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-selected",b.dataset.m===m));movePill();
  if(routeLayer){m==="roads"?routeLayer.addTo(map):map.removeLayer(routeLayer)}
  map.getContainer().style.cursor="";
  if(prev==="tracks"||m==="tracks")setSat(sat);    // terrain base (no roads) only in Tracks
  if(prev==="tracks")railLeave();
  applyLayers();                                   // gates land weather, boundaries, labels, cities, night, and the ocean/rail layers
  if(m!=="oceans"){zones.forEach(z=>z.on&&Date.now()-z.last>TTL&&!z.busy&&z.load(true));syncStatus()}   // weather already loaded is reused
  else ocEnter();
  if(m==="tracks")railEnter();
}
async function ocEnter(){
  ocSyncStatus();setStatus(OC.pts.length&&!OC.busy?"ok":"load");
  await worldReady;if(MODE!=="oceans")return;
  if(!world){setStatus("err");toast("Land outlines could not be loaded, so the ocean map is unavailable");return}
  if(!marineP)marineP=loadJSON(MARINE_URLS,j=>j&&j.type==="FeatureCollection"&&j.features.length>5).then(j=>{marine=j;return j});
  if(!OC.mask){ocInitGrid();OC.mask=ocBuildMask();OC.samples=ocSamples()}
  ocApply();
  if(OC.pts.length)ocRender();
  ocLoad(false);
}
function wireModes(){
  document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  wireShip();document.body.classList.add("m-roads");movePill();addEventListener("resize",movePill);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(movePill);
  map.on("zoomend",ocZoomStyle);wireRail();
  setInterval(()=>{if(MODE==="oceans"&&!document.hidden)ocLoad(true)},TTL);   // auto-refresh ocean weather (Oceans mode only)
}

/* ================= CONTROLS + STATUS ================= */
function wire(){
  $("zi").onclick=()=>map.zoomIn();$("zo").onclick=()=>map.zoomOut();$("rst").onclick=()=>{closeSheet();resetView()};
  $("bt").onclick=()=>setSat(!sat);
  $("ref").onclick=()=>{if(MODE==="oceans")ocLoad(true);else zones.forEach(z=>z.on&&z.load(true))};
  $("lyb").onclick=()=>{const l=$("lay");l.style.display=l.style.display==="block"?"none":"block"};
  $("loc").onclick=()=>locate().then(ll=>{map.flyTo(ll,10,{duration:.9});pick(ll,null,true)}).catch(()=>{});
  $("lay").querySelectorAll("input").forEach(cb=>cb.onchange=()=>{F[cb.dataset.l]=cb.checked;applyLayers()});
  $("chips").innerHTML=Object.keys(ZDEF).map(k=>`<button class="chip" data-z="${k}" aria-pressed="false" disabled>${ZDEF[k].name}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const z=zones.find(q=>q.id===b.dataset.z);setZone(b.dataset.z,!(z&&z.on),true)});
  if(innerWidth<640)$("legend").open=false;
  $("lgb").innerHTML=CL.map(c=>`<div><i style="background:${c[1]}"></i>${c[2]} ${c[0]}</div>`).join("");
}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function setStatus(s){
  const t=$("stx");$("dot").className=s==="ok"?"ok":s==="err"?"err":"";
  if(s==="load"){t.textContent="Loading live weather...";$("ref").classList.add("spin")}
  else if(s==="err")t.textContent="Weather data temporarily unavailable";
  else tick();
}
function syncStatus(){
  if(MODE==="oceans"){ocSyncStatus();return}
  if(zones.some(z=>z.busy))return;$("ref").classList.remove("spin");
  const on=zones.filter(z=>z.on);
  if(on.every(z=>z.pts.length)&&!on.some(z=>z.fail))setStatus("ok");
  else if(on.some(z=>z.pts.length)){setStatus("ok");toast("Some areas could not be loaded")}
  else{setStatus("err");toast("Weather data temporarily unavailable")}
}
function tick(){
  const l=MODE==="oceans"?(OC.last?[OC.last]:[]):zones.filter(z=>z.on&&z.last).map(z=>z.last);if(!l.length)return;
  const m=Math.floor((Date.now()-Math.min(...l))/60e3);
  $("stx").textContent=`Live weather · Updated ${m<1?"just now":m+" min ago"}`;
}
setInterval(()=>{if($("dot").classList.contains("ok"))tick()},30e3);
setInterval(()=>{if(MODE!=="oceans")zones.forEach(z=>z.on&&z.load(true))},TTL);   // auto-refresh every 30 min

/* ================= START ================= */
(async()=>{
  initMap();wire();wireModes();drawNight();setInterval(drawNight,5*60e3);
  const [st,wd]=await Promise.all([
    loadJSON(STATE_URLS,j=>j.type==="FeatureCollection"&&j.features.length>20),
    loadJSON(WORLD_URLS,j=>j.type==="FeatureCollection"&&j.features.length>100)]);
  states=st;world=wd;_wr();
  if(!states){setStatus("err");toast("Could not load state boundaries; weather zones need them to stay on land");return}
  states.features.forEach(f=>f._bb=turf.bbox(f));
  if(world)Object.keys(ZDEF).forEach(k=>{$("chips").querySelector(`[data-z=${k}]`).disabled=false});
  else{$("chips").querySelector('[data-z=sub]').disabled=false;toast("World boundary data failed to load; only India is available")}
  setZone("sub",true,false);
})();
</script>
</body>
